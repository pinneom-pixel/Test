<style>
/* Layout: sticky header with three big tabs, a person bar, then one view at a time. Posts are colour-coded and every view highlights the selected person. */
:root {
  --font-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --bg: #EAF1F1;
  --surface: #FFFFFF;
  --surface-2: #F3F8F8;
  --ink: #0C2A31;
  --muted: #4F6B73;
  --line: #CFDDDF;
  --accent: #0A6F82;
  --accent-ink: #FFFFFF;
  --me: #FFD84D;
  --me-ink: #3A2C00;
  --am: #FFE8A8; --am-ink: #5A3F00;
  --pm: #D9DDFB; --pm-ink: #26307A;
  --off-ink: #7A8F95;
  --c-pusher-bg: #D3F0DB; --c-pusher-ink: #12502A;
  --c-catcher-bg: #D5E5FB; --c-catcher-ink: #123778;
  --c-tower-bg: #FFE0C6; --c-tower-ink: #7A3300;
  --c-boardA-bg: #E4DAFA; --c-boardA-ink: #3E1D86;
  --c-boardB-bg: #F8D5ED; --c-boardB-ink: #7A0E55;
  --c-pool-bg: #CBEEE9; --c-pool-ink: #0B4F49;
  --c-lunch-bg: #F3F8F8; --c-lunch-ink: #4F6B73;
  --now: #D6361F;
  --s-pusher: #1B7F3B; --s-catcher: #1F4FBF; --s-tower: #D9501A; --s-boardA: #7B2FC4; --s-boardB: #CC1560; --s-pool: #0E8A81;
  --bd-bg: #0B1E2E; --bd-line: #24475F; --bd-ink: #EAF3F8; --bd-title: #7FD3FF;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #071A1F; --surface: #0E262D; --surface-2: #123038; --ink: #E5F1F3; --muted: #93AEB5; --line: #21424A;
    --accent: #55C7DA; --accent-ink: #04242B;
    --me: #FFD84D; --me-ink: #2E2300;
    --am: #4A3A10; --am-ink: #FFE29A; --pm: #272E5E; --pm-ink: #C9D0FF; --off-ink: #6F8B92;
    --c-pusher-bg: #12392A; --c-pusher-ink: #A8EBC1;
    --c-catcher-bg: #14305C; --c-catcher-ink: #B5D2FB;
    --c-tower-bg: #4A2A12; --c-tower-ink: #FFC99C;
    --c-boardA-bg: #30245A; --c-boardA-ink: #D0BFFB;
    --c-boardB-bg: #4A1639; --c-boardB-ink: #F6B6DE;
    --c-pool-bg: #0F3B38; --c-pool-ink: #9DE6DC;
    --c-lunch-bg: #123038; --c-lunch-ink: #93AEB5;
    --now: #FF6B52;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #071A1F; --surface: #0E262D; --surface-2: #123038; --ink: #E5F1F3; --muted: #93AEB5; --line: #21424A;
  --accent: #55C7DA; --accent-ink: #04242B;
  --me: #FFD84D; --me-ink: #2E2300;
  --am: #4A3A10; --am-ink: #FFE29A; --pm: #272E5E; --pm-ink: #C9D0FF; --off-ink: #6F8B92;
  --c-pusher-bg: #12392A; --c-pusher-ink: #A8EBC1;
  --c-catcher-bg: #14305C; --c-catcher-ink: #B5D2FB;
  --c-tower-bg: #4A2A12; --c-tower-ink: #FFC99C;
  --c-boardA-bg: #30245A; --c-boardA-ink: #D0BFFB;
  --c-boardB-bg: #4A1639; --c-boardB-ink: #F6B6DE;
  --c-pool-bg: #0F3B38; --c-pool-ink: #9DE6DC;
  --c-lunch-bg: #123038; --c-lunch-ink: #93AEB5;
  --now: #FF6B52;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 18px; line-height: 1.35;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; -webkit-tap-highlight-color: transparent; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1100px; margin: 0 auto; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--surface); margin: 0 calc(-1 * max(16px, env(safe-area-inset-right, 0px))) 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; }
.brand { display: flex; flex-direction: column; min-width: 0; }
.brand small { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.brand h1 { font-size: 26px; font-weight: 800; line-height: 1.05; }
.tabs { display: flex; gap: 6px; flex: 1; min-width: 280px; }
.tab { flex: 1; min-height: 52px; border-radius: 12px; background: var(--surface-2); font-weight: 700; font-size: 17px; color: var(--muted); border: 2px solid transparent; }
.tab[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }

.who { padding-block: 16px 6px; }
.who-label { font-size: 13px; letter-spacing: .1em; text-transform: uppercase; font-weight: 700; color: var(--muted); margin-bottom: 8px; }
.names { display: flex; flex-wrap: wrap; gap: 8px; }
.nm { min-height: 48px; padding: 0 16px; border-radius: 999px; background: var(--surface); border: 2px solid var(--line); font-weight: 700; font-size: 18px; display: inline-flex; align-items: center; gap: 6px; }
.nm small { font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: .06em; }
.nm[aria-pressed="true"] { background: var(--me); color: var(--me-ink); border-color: var(--me-ink); }
.nm[aria-pressed="true"] small { color: var(--me-ink); }
.nm.all { color: var(--muted); }

.view { padding-top: 14px; display: grid; gap: 14px; }
.summary { font-family: var(--font-display); font-size: 22px; font-weight: 600; }
.summary span { color: var(--muted); font-family: var(--font-body); font-size: 17px; font-weight: 400; }
.prompt { padding: 28px 20px; background: var(--surface); border: 2px dashed var(--line); border-radius: 16px; text-align: center; font-size: 20px; color: var(--muted); }

/* My week */
.days { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 480px), 1fr)); }
.day { background: var(--surface); border: 2px solid var(--line); border-radius: 16px; padding: 14px; display: grid; gap: 12px; align-content: start; min-width: 0; }
.day.today { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
.day-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.day-head h3 { font-size: 24px; font-weight: 800; }
.pill-today { background: var(--accent); color: var(--accent-ink); font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 3px 10px; border-radius: 999px; }
.shift { margin-left: auto; padding: 6px 12px; border-radius: 10px; font-weight: 700; font-size: 16px; }
.shift.AM { background: var(--am); color: var(--am-ink); }
.shift.PM { background: var(--pm); color: var(--pm-ink); }
.day.off { background: var(--surface-2); }
.day.off .off-text { font-family: var(--font-display); font-size: 26px; font-weight: 800; color: var(--off-ink); letter-spacing: .04em; }
.tiles { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 140px), 1fr)); }
.tile { border-radius: 12px; padding: 8px 10px 10px; min-width: 0; display: grid; gap: 2px; align-content: start; }
.tile b { font-size: 13px; letter-spacing: .06em; opacity: .85; }
.tile .p { font-family: var(--font-display); font-weight: 800; font-size: 19px; line-height: 1.1; }
.tile .s { font-size: 13px; opacity: .85; }
.tile.now { outline: 4px solid var(--now); outline-offset: 1px; }
.note { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; color: var(--muted); font-size: 16px; }

[class*="col-"] { background: var(--bg-c); color: var(--ink-c); }
.col-pusher { --bg-c: var(--c-pusher-bg); --ink-c: var(--c-pusher-ink); }
.col-catcher { --bg-c: var(--c-catcher-bg); --ink-c: var(--c-catcher-ink); }
.col-tower, .col-ptower { --bg-c: var(--c-tower-bg); --ink-c: var(--c-tower-ink); }
.col-boardA, .col-pboard { --bg-c: var(--c-boardA-bg); --ink-c: var(--c-boardA-ink); }
.col-boardB { --bg-c: var(--c-boardB-bg); --ink-c: var(--c-boardB-ink); }
.col-pool { --bg-c: var(--c-pool-bg); --ink-c: var(--c-pool-ink); }
.col-lunch { --bg-c: var(--c-lunch-bg); --ink-c: var(--c-lunch-ink); border: 2px dashed var(--line); }

/* Live board: wall-display style panels on a dark navy ground, post colours are solid and shared by cards, headers and the flow diagram */
.daypick { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.dp { min-height: 56px; border-radius: 12px; background: var(--surface); border: 2px solid var(--line); font-weight: 700; display: grid; place-items: center; line-height: 1.1; padding: 4px 2px; }
.dp small { font-size: 11px; color: var(--muted); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.dp[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.dp[aria-pressed="true"] small { color: var(--accent-ink); }
.hourpick { display: grid; grid-template-columns: repeat(auto-fit, minmax(52px, 1fr)); gap: 6px; }
.hp { position: relative; min-height: 48px; border-radius: 10px; background: var(--surface); border: 2px solid var(--line); font-weight: 700; font-size: 16px; }
.hp[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.hp.live::after { content: ""; position: absolute; top: 5px; right: 5px; width: 8px; height: 8px; border-radius: 50%; background: var(--now); }
.jump { justify-self: start; min-height: 44px; padding: 0 16px; border-radius: 999px; background: var(--now); color: #fff; font-weight: 700; }
.ctl { display: grid; gap: 8px; }
.board { display: grid; gap: 12px; }
.map { margin: 0; border-radius: 14px; overflow: hidden; background: var(--bd-bg); line-height: 0; }
.map img { width: 100%; height: auto; display: block; }
.panels { display: grid; gap: 12px; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); grid-template-areas: "cur flow" "sched next"; align-items: start; }
.p-cur { grid-area: cur; } .p-flow { grid-area: flow; } .p-sched { grid-area: sched; } .p-next { grid-area: next; }
@media (max-width: 860px) { .panels { grid-template-columns: minmax(0, 1fr); grid-template-areas: "cur" "next" "flow" "sched"; } }
.panel { background: var(--bd-bg); color: var(--bd-ink); border: 1px solid var(--bd-line); border-radius: 14px; padding: 12px; display: grid; gap: 10px; min-width: 0; }
.panel h2 { font-size: 22px; font-weight: 800; letter-spacing: .02em; text-transform: uppercase; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; }
.panel h2 .tm { font-family: var(--font-body); color: var(--bd-title); font-size: 19px; font-weight: 700; text-transform: none; letter-spacing: 0; }
.panel h2 .live { font-family: var(--font-body); background: var(--now); color: #fff; font-size: 12px; letter-spacing: .1em; padding: 3px 9px; border-radius: 999px; }
.tagline { justify-self: start; background: var(--s-pool); color: #fff; font-weight: 700; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; padding: 4px 10px; border-radius: 8px; }
.k-pusher { --sc: var(--s-pusher); } .k-catcher { --sc: var(--s-catcher); } .k-tower { --sc: var(--s-tower); }
.k-boardA { --sc: var(--s-boardA); } .k-boardB { --sc: var(--s-boardB); } .k-pool { --sc: var(--s-pool); }
.cards { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(112px, 1fr)); }
.cards.s { grid-template-columns: repeat(auto-fit, minmax(66px, 1fr)); gap: 6px; }
.pc, .mini { border: 3px solid var(--sc); border-radius: 10px; overflow: hidden; background: #fff; display: grid; grid-template-rows: auto 1fr auto; min-width: 0; }
.pc-h { background: var(--sc); color: #fff; padding: 5px 6px; display: flex; gap: 6px; align-items: center; min-height: 46px; }
.pc-h i { flex: none; width: 24px; height: 24px; border-radius: 50%; background: #fff; color: var(--sc); font-style: normal; font-weight: 800; display: grid; place-items: center; font-size: 14px; }
.pc-h span { display: grid; line-height: 1.05; min-width: 0; }
.pc-h b { font-size: 12px; letter-spacing: .03em; text-transform: uppercase; }
.pc-h small { font-size: 11.5px; opacity: .92; }
.pc-ph { aspect-ratio: 4 / 3; background: linear-gradient(160deg, color-mix(in srgb, var(--sc) 28%, #fff), color-mix(in srgb, var(--sc) 52%, #fff)); display: grid; place-items: end center; overflow: hidden; color: color-mix(in srgb, var(--sc) 70%, #000); }
.pc-ph svg { width: 68%; height: auto; display: block; opacity: .55; fill: currentColor; }
.pc-ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.pc-n { background: #fff; color: #0C2A31; text-align: center; font-family: var(--font-display); font-weight: 800; font-size: 19px; padding: 6px 4px; overflow-wrap: anywhere; }
.pc-n.me { background: var(--me); color: var(--me-ink); }
.cards.s .pc-h { min-height: 0; padding: 4px; gap: 4px; }
.cards.s .pc-h i { width: 18px; height: 18px; font-size: 11px; }
.cards.s .pc-h b { font-size: 9.5px; }
.cards.s .pc-h small { display: none; }
.cards.s .pc-n { font-size: 14px; padding: 4px 2px; }
.grps { display: grid; gap: 10px; }
.grp { display: grid; gap: 6px; }
.grp-h { background: var(--sc); color: #fff; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; font-size: 13px; padding: 5px 10px; border-radius: 8px; display: flex; justify-content: space-between; gap: 8px; }
.minis { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); }
.minis .pc-ph { aspect-ratio: 1 / 1; }
.minis .pc-n { font-size: 16px; }
.minis.s { grid-template-columns: repeat(auto-fit, minmax(60px, 1fr)); gap: 6px; }
.minis.s .pc-n { font-size: 13px; }
.lunchbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 15px; color: var(--bd-ink); }
.lp { background: #fff; color: #0C2A31; border-radius: 999px; padding: 2px 10px; font-weight: 700; font-size: 15px; }
.lp.me { background: var(--me); color: var(--me-ink); }
.flow svg { width: 100%; height: auto; display: block; max-height: 300px; }
.flow .cap { color: var(--bd-title); font-size: 16px; font-weight: 600; text-align: center; }
.sched { overflow-x: auto; border-radius: 8px; }
.sched table { min-width: 560px; border-collapse: collapse; background: #F5F9FC; color: #0C2A31; width: 100%; }
.sched thead th { position: static; background: #16384F; color: #fff; font-size: 12px; padding: 7px 4px; text-transform: uppercase; letter-spacing: .04em; border-bottom: 0; }
.sched thead th.sc { background: var(--sc); }
.sched td { padding: 9px 4px; border-bottom: 1px solid #D4E2EC; font-size: 17px; text-align: center; }
.sched td.t { font-weight: 800; white-space: nowrap; background: #E4EEF5; text-align: left; padding-inline: 8px; }
.sched .tag { display: block; font-size: 10px; font-weight: 700; color: #4F6B73; letter-spacing: .06em; text-transform: uppercase; }
.sched tr[data-h] { cursor: pointer; }
.sched tr.cur td { background: #CFE8FF; font-weight: 800; box-shadow: inset 0 2px 0 #1F7BD8, inset 0 -2px 0 #1F7BD8; }
.sched td.me, .sched tr.cur td.me { background: var(--me); color: var(--me-ink); font-weight: 800; }
.sched td.pp { text-align: left; padding: 6px 10px; font-size: 15px; font-weight: 600; }
.sched .g { display: inline-block; margin: 2px 14px 2px 0; }
.sched .g b { color: var(--sc); font-weight: 800; }
.sched mark { background: var(--me); color: var(--me-ink); padding: 0 5px; border-radius: 5px; font-weight: 800; }
.crews { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); }
.crew { background: var(--surface); border: 2px solid var(--line); border-radius: 14px; padding: 12px; display: grid; gap: 8px; min-width: 0; }
.crew h3 { font-size: 18px; font-weight: 800; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
.crew h3 span { font-family: var(--font-body); font-weight: 600; font-size: 15px; color: var(--muted); }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pl { padding: 4px 12px; border-radius: 999px; background: var(--surface-2); font-weight: 700; font-size: 17px; border: 2px solid transparent; }
.pl.me { background: var(--me); color: var(--me-ink); border-color: var(--me-ink); }

/* Whole team */
.tablewrap { overflow-x: auto; background: var(--surface); border: 2px solid var(--line); border-radius: 14px; }
table { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 640px; }
th, td { padding: 0; text-align: center; border-bottom: 1px solid var(--line); }
thead th { position: sticky; top: 0; background: var(--surface); font-size: 14px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 10px 4px; z-index: 2; }
thead th.today { color: var(--accent); }
th.rowname, td.rowname { position: sticky; left: 0; background: var(--surface); z-index: 1; text-align: left; border-right: 1px solid var(--line); }
thead th.rowname { z-index: 3; }
.rn { display: flex; align-items: center; gap: 6px; width: 100%; min-height: 56px; padding: 0 12px; font-weight: 700; font-size: 19px; text-align: left; }
.rn small { font-size: 11px; color: var(--muted); letter-spacing: .06em; }
tr.me td, tr.me th.rowname { background: color-mix(in srgb, var(--me) 38%, var(--surface)); }
tr.me .rn { color: var(--ink); }
.cell { display: grid; place-items: center; width: 100%; min-height: 56px; font-weight: 700; font-size: 17px; }
.cell span { padding: 6px 12px; border-radius: 10px; min-width: 52px; }
.cell .AM { background: var(--am); color: var(--am-ink); }
.cell .PM { background: var(--pm); color: var(--pm-ink); }
.cell .OFF { color: var(--off-ink); font-weight: 600; }
.cell .RF { outline: 2px dashed currentColor; outline-offset: -3px; }
td.today, th.today.col { background: color-mix(in srgb, var(--accent) 8%, transparent); }
.count { font-weight: 700; color: var(--muted); font-size: 17px; padding: 0 10px; }
.legend { color: var(--muted); font-size: 15px; }
@media (max-width: 560px) {
  .hr { grid-template-columns: 1fr; gap: 6px; }
  .hr-time { grid-auto-flow: column; justify-content: start; align-items: baseline; gap: 8px; }
  .brand h1 { font-size: 22px; }
}
@media (prefers-reduced-motion: no-preference) { .tab, .nm, .dp { transition: background .12s; } }
</style>

  <div class="brand"><small>Cabo Real Glide</small><h1>Roster</h1></div>

</div></div>
<div class="wrap">

    return { cls: "col-" + p.k, t: e.kind === "party" ? "POOL PARTY" : "", p: l, s };
  }
  return null;
}
function pill(n, extra) { return `<span class="pl${n === st.me ? " me" : ""}">${esc(n)}</span>`; }

function renderNames() {
  const el = document.getElementById("names");
  document.getElementById("whoLabel").textContent = st.view === "me" ? "Tap your name" : "Highlight a person";
  el.innerHTML = D.people.map(p => `<button class="nm" data-n="${esc(p.name)}" aria-pressed="${p.name === st.me}">${esc(p.name)}${p.type === "PT" ? "<small>PT</small>" : ""}</button>`).join("") +
    (st.view !== "me" && st.me ? `<button class="nm all" data-n="">Clear</button>` : "");
}
function renderTabs() {
  const T = [["board", "Live board"], ["me", "My week"], ["team", "Whole team"]];
  document.getElementById("tabs").innerHTML = T.map(([k, l]) => `<button class="tab" role="tab" data-v="${k}" aria-selected="${st.view === k}">${l}</button>`).join("");
}

function viewMe() {
  if (!st.me) return `<div class="prompt">Tap your name above to see your week.</div>`;
  const t = todayIdx(), hr = new Date().getHours();
  let work = 0, offs = [];
  const cards = DAYS.map((dn, d) => {
    const info = shiftOf(st.me, d), isT = d === t;
    const head = `<div class="day-head"><h3>${dn}</h3>${isT ? '<span class="pill-today">Today</span>' : ""}`;
    if (!info) { offs.push(SHORT[d]); return `<section class="day off${isT ? " today" : ""}">${head}</div><div class="off-text">DAY OFF</div></section>`; }
    work++;
    const S = SHIFT[info.sh];
    let body;
    if (info.relief) {
      body = `<div class="note"><b>Relief / float shift.</b> No fixed post. Your supervisor will tell you where to cover. Lunch is ${S.lunch}.</div>`;
    } else {
      body = `<div class="tiles">` + D.hours[dn].filter(e => e.h >= S.s && e.h < S.e).map(e => {
        const x = tileFor(st.me, e); if (!x) return "";
        const now = isT && hr === e.h;
        return `<div class="tile ${x.cls}${now ? " now" : ""}"><b>${f12(e.h)}–${f12(e.h + 1)} ${sfx(e.h)}${x.t && x.t !== "LUNCH" ? " · " + x.t : ""}${now ? " · NOW" : ""}</b><span class="p">${esc(x.p)}</span><span class="s">${esc(x.s)}</span></div>`;
      }).join("") + `</div>`;
    }
    return `<section class="day${isT ? " today" : ""}">${head}<span class="shift ${info.sh}">${info.sh} · ${S.t}</span></div>${body}</section>`;
  }).join("");
  return `<div class="summary">${esc(st.me)} <span>· ${work} shifts this week${offs.length ? " · off " + offs.join(", ") : ""}</span></div><div class="days">${cards}</div>`;
}

function card(p) {
  const i = KEYS.indexOf(p.k), [l, s] = INFO[p.k], n = p.n[0];
  return `<div class="pc k-${p.k}"><div class="pc-h"><i>${i + 1}</i><span><b>${l}</b><small>${s}</small></span></div><div class="pc-ph">${ph(n)}</div><div class="pc-n${meCls(n)}">${esc(n)}</div></div>`;
}
function party(e, small) {
  return e.posts.map(p => {
    const [l, s] = PG[p.k];
    return `<div class="grp k-${SC[p.k]}"><div class="grp-h"><span>${l}</span><span>${s}</span></div><div class="minis${small ? " s" : ""}">${p.n.map(n => `<div class="mini"><div class="pc-ph">${ph(n)}</div><div class="pc-n${meCls(n)}">${esc(n)}</div></div>`).join("")}</div></div>`;
  }).join("");
}
function lunchbar(e) {
  return e.lunch.length ? `<div class="lunchbar">${e.kind === "lunchAM" ? "AM crew" : "PM crew"} on lunch: ${e.lunch.map(n => `<span class="lp${meCls(n)}">${esc(n)}</span>`).join("")}</div>` : "";
}
function entryHTML(e, small) {
  return e.kind === "party" ? `<div class="grps">${party(e, small)}</div>` : `<div class="cards${small ? " s" : ""}">${e.posts.map(p => small ? card(p) : card(p)).join("")}</div>`;
}
function flow(e) {
  const pos = { pusher: [180, 34], catcher: [296, 102], tower: [252, 200], boardA: [108, 200], boardB: [64, 102] };
  const mine = st.me ? e.posts.find(p => p.n.includes(st.me)) : null;
  const boxes = KEYS.map((k, i) => {
    const [x, y] = pos[k], on = mine && mine.k === k;
    return `<g class="k-${k}"><rect x="${x - 56}" y="${y - 23}" width="112" height="46" rx="9" fill="var(--sc)"${on ? ' stroke="var(--me)" stroke-width="5"' : ""}/><circle cx="${x - 40}" cy="${y}" r="11" fill="#fff"/><text x="${x - 40}" y="${y + 5}" text-anchor="middle" font-size="14" font-weight="800" fill="var(--sc)">${i + 1}</text><text x="${x - 24}" y="${y + 4.5}" font-size="11.5" font-weight="700" fill="#fff">${INFO[k][0]}</text></g>`;
  }).join("");
  const arrows = ["M242 46 L272 72", "M294 128 L278 170", "M194 200 L166 200", "M92 172 L76 130", "M92 74 L122 46"].map(d => `<path d="${d}" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" marker-end="url(#ah)"/>`).join("");
  return `<svg viewBox="0 0 360 250" role="img" aria-label="Rotation order: Pool Pusher, Pool Catcher, Control Tower, Board Room A, Board Room B, then back to Pool Pusher"><defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#fff"/></marker></defs>${arrows}${boxes}</svg>`;
}
function setDay(i) {
  st.day = i; const nh = nowHour();
  if (i === todayIdx() && nh !== null) { st.hour = nh; st.live = true; } else st.live = false;
}
function viewBoard() {
  const dn = DAYS[st.day], S = D.schedule[dn], t = todayIdx(), nh = nowHour(), isT = st.day === t;
  const L = D.hours[dn], e = L[st.hour - 7], nx = L[st.hour - 6];
  const off = names.filter(n => !shiftOf(n, st.day));
  const days = `<div class="daypick">${DAYS.map((x, i) => `<button class="dp" data-d="${i}" aria-pressed="${i === st.day}"><small>${i === t ? "Today" : "&nbsp;"}</small>${SHORT[i]}</button>`).join("")}</div>`;
  const hours = `<div class="hourpick">${L.map(x => `<button class="hp${isT && nh === x.h ? " live" : ""}" data-h="${x.h}" aria-pressed="${x.h === st.hour}">${f12(x.h)}${x.h < 12 ? "a" : "p"}</button>`).join("")}</div>`;
  const jump = isT && nh !== null && st.hour !== nh ? `<button class="jump" data-jump="1">Jump to now</button>` : "";
  const liveNow = isT && nh === st.hour;
  const cur = `<section class="panel p-cur"><h2>Current hour <span class="tm">${hrLabel(e.h)}</span>${liveNow ? '<span class="live">LIVE</span>' : `<span class="tm">· ${dn}</span>`}</h2>${e.kind === "party" ? '<div class="tagline">Pool party hour · all 10 on posts</div>' : ""}${entryHTML(e, false)}${lunchbar(e)}</section>`;
  const next = nx
    ? `<section class="panel p-next"><h2>Next hour <span class="tm">${hrLabel(nx.h)}</span></h2>${nx.kind === "party" ? '<div class="tagline">Pool party hour</div>' : ""}${entryHTML(nx, true)}${lunchbar(nx)}</section>`
    : `<section class="panel p-next"><h2>Next hour</h2><div class="lunchbar">That is the last hour of the day.</div></section>`;
  const fl = `<section class="panel p-flow flow"><h2>Rotation flow</h2>${flow(e)}<div class="cap">Everyone rotates each hour in this direction</div></section>`;
  const rows = L.map(x => {
    const tag = x.kind === "lunchAM" ? "AM crew lunch" : x.kind === "lunchPM" ? "PM crew lunch" : x.kind === "party" ? "Pool party" : "";
    const tc = `<td class="t">${f12(x.h)}:00–${f12(x.h + 1)}:00${tag ? `<span class="tag">${tag}</span>` : ""}</td>`;
    const c = x.h === st.hour ? "cur" : "";
    if (x.kind === "party") {
      const g = x.posts.map(p => `<span class="g k-${SC[p.k]}"><b>${PG[p.k][0]}:</b> ${p.n.map(n => n === st.me ? `<mark>${esc(n)}</mark>` : esc(n)).join(", ")}</span>`).join("");
      return `<tr data-h="${x.h}" class="${c}">${tc}<td class="pp" colspan="5">${g}</td></tr>`;
    }
    return `<tr data-h="${x.h}" class="${c}">${tc}${x.posts.map(p => `<td class="${p.n[0] === st.me ? "me" : ""}">${esc(p.n[0])}</td>`).join("")}</tr>`;
  }).join("");
  const sched = `<section class="panel p-sched"><h2>Hourly rotation schedule <span class="tm">${dn}</span></h2><div class="sched"><table><thead><tr><th>Time</th>${KEYS.map((k, i) => `<th class="sc k-${k}">${i + 1} ${INFO[k][0]}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table></div></section>`;
  const crew = (title, sub, list, rel) => `<div class="crew"><h3>${title} <span>${sub}</span></h3><div class="pills">${list.map(n => `<span class="pl${meCls(n)}">${esc(n)}</span>`).join("")}${rel.map(n => `<span class="pl${meCls(n)}">${esc(n)} (relief)</span>`).join("")}</div></div>`;
  const crews = `<div class="crews">${crew("AM crew", SHIFT.AM.t, S.AM, S.relief.AM)}${crew("PM crew", SHIFT.PM.t, S.PM, S.relief.PM)}${crew("Day off", "", off, [])}</div>`;
  return `<div class="ctl">${days}${hours}${jump}</div><div class="board"><figure class="map"><img src="${MAP_SRC}" alt="Aerial view of the wave pool showing Zone 1 on the left, Zone 5 on the right, the control tower and the board room"></figure><div class="panels">${cur}${fl}${sched}${next}</div></div>${crews}`;
}

function viewTeam() {
  const t = todayIdx();
  const head = `<tr><th class="rowname">Name</th>${DAYS.map((d, i) => `<th class="col${i === t ? " today" : ""}">${SHORT[i]}</th>`).join("")}<th>Shifts</th></tr>`;
  const rows = D.people.map(p => {
    let c = 0;
    const tds = DAYS.map((d, i) => {
      const info = shiftOf(p.name, i); if (info) c++;
      const lab = info ? `<span class="${info.sh}${info.relief ? " RF" : ""}">${info.sh}${info.relief ? " float" : ""}</span>` : `<span class="OFF">off</span>`;
      return `<td class="${i === t ? "today" : ""}"><button class="cell" data-pd="${i}" data-pn="${esc(p.name)}" aria-label="${esc(p.name)} ${d}">${lab}</button></td>`;
    }).join("");
    return `<tr class="${p.name === st.me ? "me" : ""}"><th class="rowname"><button class="rn" data-n="${esc(p.name)}">${esc(p.name)}${p.type === "PT" ? "<small>PT</small>" : ""}</button></th>${tds}<td class="count">${c}</td></tr>`;
  }).join("");
  return `<div class="summary">Whole team <span>· tap a name to highlight the row, tap a shift to open that day</span></div><div class="tablewrap"><table><thead>${head}</thead><tbody>${rows}</tbody></table></div><div class="legend">AM 7:00 AM–3:00 PM · PM 11:00 AM–7:00 PM · dashed outline = relief / float shift</div>`;
}

function render() {
  renderTabs(); renderNames();
  document.getElementById("view").innerHTML = st.view === "me" ? viewMe() : st.view === "board" ? viewBoard() : viewTeam();
}
document.addEventListener("click", ev => {
  const row = ev.target.closest("tr[data-h]");
  if (row && !ev.target.closest("button")) { st.hour = +row.dataset.h; st.live = false; render(); return; }
  const b = ev.target.closest("button"); if (!b) return;
  if (b.dataset.v) { st.view = b.dataset.v; store.set("glide.view", st.view); window.scrollTo(0, 0); }
  else if (b.dataset.pn) { st.me = b.dataset.pn; store.set("glide.me", st.me); setDay(+b.dataset.pd); st.view = "board"; window.scrollTo(0, 0); }
  else if (b.dataset.d) setDay(+b.dataset.d);
  else if (b.dataset.h) { st.hour = +b.dataset.h; st.live = false; }
  else if (b.dataset.jump) setDay(todayIdx());
  else if (b.dataset.n !== undefined) { st.me = b.dataset.n || null; store.set("glide.me", st.me || ""); }
  else return;
  render();
});
setDay(todayIdx());
render();
let lastNow = nowHour();
setInterval(() => {
  const c = nowHour(); if (c === lastNow) return;
  lastNow = c;
  if (st.live && st.day === todayIdx() && c !== null) st.hour = c;
  if (st.view !== "team") render();
}, 30000);
</script>
